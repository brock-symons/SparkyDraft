name: Boot check

# There is no build step and no test suite for index.html (the live app).
# This is the minimum useful CI check: load it in headless Chromium and
# fail if the page throws a console error while booting. See
# audits/2026-09-03-full-repository-audit.md §6.1.

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app/src/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/src/**'

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (Chromium only)
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Serve the repo root
        # index.html's module loader uses fetch() to pull in app/src/*.jsx —
        # browsers block that from a file:// page (CORS treats file:// as an
        # opaque origin), so this has to be served like a real deployment
        # would, not opened as a local file.
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8123/index.html >/dev/null && break
            sleep 0.5
          done

      - name: Boot index.html headlessly and check for console errors
        run: |
          cat <<'EOF' > boot-check.mjs
          import { chromium } from 'playwright';

          const errors = [];
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('pageerror', (err) => errors.push(String(err)));
          page.on('console', (msg) => {
            if (msg.type() === 'error') errors.push(msg.text());
          });

          await page.goto('http://127.0.0.1:8123/index.html', { waitUntil: 'load', timeout: 30000 });
          await page.waitForTimeout(2000);
          await browser.close();

          if (errors.length) {
            console.error(`index.html threw ${errors.length} console error(s) on boot:`);
            for (const e of errors) console.error(' -', e);
            process.exit(1);
          }
          console.log('index.html booted with no console errors.');
          EOF
          node boot-check.mjs
